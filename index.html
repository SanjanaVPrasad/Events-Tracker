      "when": "Community, ongoing",
      "m": 0,
      "note": "Your link lists no bootcamp in these three cities right now (open ones: Surat 25 Oct, Pune 31 Oct, Kochi 31 Oct). Bengaluru has a corporate quiz at Stripe on 28 Oct, not open to the public. Free; apply on the page."
    }
  ]
}</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('events-data').textContent);
  var EV = DATA.events, META = DATA.meta || {};
  var TODAY = META.last_scan || new Date().toISOString().slice(0,10);
  var TIERS = [[1,'Bengaluru'],[2,'Pune'],[3,'Hyderabad'],[4,'Mumbai'],[5,'Delhi NCR'],[6,'Tier-two cities'],[7,'Online / Pan-India']];
  var TYPES = {conference:'Conferences',meetup:'Meetups',hackathon:'Hackathons',workshop:'Workshops',expo:'Expos'};
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONFULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var f = {tier:0,type:'',must:false,free:false,cert:false,sort:'date',group:true};
  function money(n){return n===0?'Free':'₹'+Number(n).toLocaleString('en-IN')}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
  function isPast(e){var end=e.end||e.start; return end && end < TODAY}
  function isNew(e){
    if(META.baseline) return false;
    if(META.prev_scan) return !!e.changes || (e.first_seen||'')>META.prev_scan;
    var d=(pd(TODAY)-pd(e.first_seen))/864e5; return d>=0 && d<35;
  }
  function isFree(e){return e.price_now_inr===0}
  function isHidden(id){return !!(PLAN.hidden&&PLAN.hidden.indexOf(id)>-1)}
  function st(e){var m=PLAN.marks&&PLAN.marks[e.id];return m||e.status||'none'}
  function dateBlock(e){
    if(!e.start) return '<div class="date"><span class="d">TBA</span><span class="tba">'+esc(e.date_label||'')+'</span></div>';
    var s=pd(e.start), t=e.end&&e.end!==e.start?pd(e.end):null;
    var d=s.getDate(), m=MON[s.getMonth()];
    var range=t?(t.getMonth()===s.getMonth()?d+'–'+t.getDate():d+' '+m+'–'+t.getDate()+' '+MON[t.getMonth()]):String(d);
    var yr=(s.getFullYear()!==pd(TODAY).getFullYear())?' ’'+String(s.getFullYear()).slice(2):'';
    return '<div class="date"><span class="d">'+range+'</span>'+m+yr+'</div>';
  }
  function evHtml(e){
    var flags='', S=st(e), onPlan=(S==='attending'||S==='want');
    if(S==='attending') flags+='<span class="flag plan">Attending</span>';
    if(S==='want') flags+='<span class="flag plan">On my list</span>';
    if(e.relevance==='must') flags+='<span class="flag must">Top pick</span>';
    flags+= e.verified ? '<span class="flag ver">Verified</span>' : '<span class="flag unv" title="'+esc((e.unconfirmed||[]).join(', '))+'">Check '+esc((e.unconfirmed||[]).slice(0,3).join(', ')||'details')+'</span>';
    if(isNew(e)) flags='<span class="flag plan">New</span>'+flags;
    var seen={}; (e.topics||[]).forEach(function(t){seen[t.toLowerCase()]=1});
    var tags=(e.certificate?'<span class="tag" style="background:var(--signal-bg);color:var(--signal)">Certificate</span>':'')+(e.topics||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+
      (e.sponsors||[]).filter(function(t){return !seen[t.toLowerCase()]}).slice(0,6).map(function(t){return '<span class="tag sp">'+esc(t)+'</span>'}).join('');
    return '<article class="ev">'+dateBlock(e)+
      '<div class="main"><h3 class="name">'+esc(e.name)+' '+flags+'</h3>'+
      '<div class="meta">'+esc(e.venue||'')+(e.city&&e.tier>=5?' · '+esc(e.city):'')+' · '+esc(TYPES[e.type]||e.type)+'</div>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+
      (e.notes?'<p class="note">'+esc(e.notes)+'</p>':'')+
      (e.changes?'<p class="note"><b>Changed:</b> '+esc(e.changes)+'</p>':'')+
      (e.deadline?'<p class="note"><b>Deadline:</b> '+esc(e.deadline)+'</p>':'')+'</div>'+
      '<div class="side">'+amtHtml(e)+'<div class="price">'+esc(e.price||'')+'</div>'+
      '<div class="acts"><button type="button" class="act" data-a="cart" data-id="'+esc(e.id)+'"></button><button type="button" class="act ghost" data-a="wish" data-id="'+esc(e.id)+'"></button>'+
      '<button type="button" class="act ghost" data-a="mark" data-k="'+esc(e.id)+'" title="'+(onPlan?'Remove from My Plans':'Add to My Plans')+'">'+(onPlan?'Unmark':'+ My plans')+'</button>'+
      '<button type="button" class="act ghost xb" data-a="hide" data-k="'+esc(e.id)+'" title="Remove this event from my page" aria-label="Remove '+esc(e.name)+' from my page">×</button></div>'+
      '<a class="go" href="'+esc(e.url)+'" target="_blank" rel="noopener">Open page</a></div></article>';
  }
  function amtHtml(e){
    var n=e.price_now_inr, cls='amt', txt;
    if(n==null){cls+=' tba';txt='Price not published'}
    else{txt=money(n); if(n===0)cls+=' free'; if(e.sold_out)cls+=' sold'}
    var extra=(e.sold_out?' <span class="flag sold">Sold out</span>':'')+(n!=null&&!e.price_confirmed?' <span class="flag pu">Price unconfirmed</span>':'');
    return '<div><span class="'+cls+'">'+txt+'</span>'+extra+'</div>';
  }
  function sortKey(e){return e.start||'9999-12-31'}
  function byDate(a,b){return sortKey(a)<sortKey(b)?-1:sortKey(a)>sortKey(b)?1:a.name.localeCompare(b.name)}
  function byPrice(dir){return function(a,b){
    var x=a.price_now_inr,y=b.price_now_inr;
    if(x==null&&y==null) return byDate(a,b);
    if(x==null) return 1; if(y==null) return -1;
    return x===y?byDate(a,b):(x-y)*dir;
  }}
  function sorted(list){return list.slice().sort(f.sort==='price-asc'?byPrice(1):f.sort==='price-desc'?byPrice(-1):byDate)}
  function passes(e){
    if(f.tier && e.tier!==f.tier) return false;
    if(f.type && e.type!==f.type) return false;
    if(f.must && e.relevance!=='must') return false;
    if(f.free && !isFree(e)) return false;
    if(f.cert && !e.certificate) return false;
    return true;
  }
  function monthLabel(e){if(!e.start) return 'Dates to be announced'; var s=pd(e.start); return MONFULL[s.getMonth()]+' '+s.getFullYear()}
  function group(list){
    var out='', last='';
    sorted(list).forEach(function(e){
      if(f.sort==='date'){var m=monthLabel(e); if(m!==last){out+='<div class="month">'+esc(m)+'</div>';last=m}}
      out+=evHtml(e)});
    return out;
  }
  function chip(label,pressed,fn){var b=document.createElement('button');b.className='chip';b.type='button';b.textContent=label;b.setAttribute('aria-pressed',pressed?'true':'false');b.onclick=fn;return b}
  function renderChips(){
    var c=document.getElementById('cityChips'); c.innerHTML='';
    var l=document.createElement('span');l.className='chip label';l.textContent='City';c.appendChild(l);
    c.appendChild(chip('All',!f.tier,function(){f.tier=0;render()}));
    TIERS.forEach(function(t){
      var n=EV.filter(function(e){return !isPast(e)&&!isHidden(e.id)&&e.tier===t[0]}).length;
      c.appendChild(chip(t[1]+' '+n,f.tier===t[0],function(){f.tier=t[0];render()}))});
    var t=document.getElementById('typeChips'); t.innerHTML='';
    var l2=document.createElement('span');l2.className='chip label';l2.textContent='Filter';t.appendChild(l2);
    t.appendChild(chip('All types',!f.type,function(){f.type='';render()}));
    Object.keys(TYPES).forEach(function(k){t.appendChild(chip(TYPES[k],f.type===k,function(){f.type=k;render()}))});
    t.appendChild(chip('Top picks',f.must,function(){f.must=!f.must;render()}));
    t.appendChild(chip('Free',f.free,function(){f.free=!f.free;render()}));
    t.appendChild(chip('Certificate',f.cert,function(){f.cert=!f.cert;render()}));
    var s=document.getElementById('sortChips'); s.innerHTML='';
    var l3=document.createElement('span');l3.className='chip label';l3.textContent='Sort';s.appendChild(l3);
    [['date','Date'],['price-asc','Price: low to high'],['price-desc','Price: high to low']].forEach(function(o){
      s.appendChild(chip(o[1],f.sort===o[0],function(){f.sort=o[0];render()}))});
    s.appendChild(chip(f.group?'Sections by city: on':'Sections by city: off (one list)',f.group,function(){f.group=!f.group;render()}));
    if(f.group){
      s.appendChild(chip('Expand all',false,function(){TIERS.forEach(function(t){OPEN['t'+t[0]]=true});render()}));
      s.appendChild(chip('Collapse all',false,function(){OPEN={};if(f.tier){f.tier=0}render()}));
    }
  }
  var OPEN={};
  document.addEventListener('toggle',function(ev){var d=ev.target;if(d&&d.classList&&d.classList.contains('sec')){OPEN[d.getAttribute('data-k')]=d.open}},true);
  function render(){
    var upcoming=EV.filter(function(e){return !isPast(e)&&!isHidden(e.id)});
    var past=EV.filter(function(e){return isPast(e)&&!isHidden(e.id)});
    var shown=upcoming.filter(passes);
    document.getElementById('stats').innerHTML=
      '<span><b>'+upcoming.length+'</b> upcoming</span><span><b>'+upcoming.filter(function(e){return e.relevance==='must'}).length+'</b> top picks</span>'+
      '<span><b>'+upcoming.filter(function(e){return e.verified}).length+'</b> verified with organizer</span><span>Scanned <b>'+esc(TODAY)+'</b></span>';
    renderChips();
    var plans=upcoming.filter(function(e){var S=st(e);return S==='attending'||S==='want'});
    document.getElementById('plans').innerHTML=plans.length?'<div class="plans"><h2>My plans</h2>'+sorted(plans).map(evHtml).join('')+'</div>':'';
    var nw=upcoming.filter(isNew);
    document.getElementById('new').innerHTML=nw.length?'<div class="plans"><h2>New since last month <small>'+nw.length+' added or changed</small></h2>'+sorted(nw).map(evHtml).join('')+'</div>':'';
    var html='';
    if(!f.group){
      html='<section><div class="rule"></div><h2>All cities <small>'+shown.length+' events, '+(f.sort==='date'?'by date':f.sort==='price-asc'?'cheapest first':'priciest first')+'</small></h2>'+
        (shown.length?group(shown.map(function(e){return e})):'<div class="empty">No events match these filters.</div>')+'</section>';
    } else
    TIERS.forEach(function(t){
      var list=shown.filter(function(e){return e.tier===t[0]});
      if(f.tier && f.tier!==t[0]) return;
      var k='t'+t[0], op=OPEN[k]||f.tier===t[0];
      html+='<section><div class="rule"></div><details class="sec" data-k="'+k+'"'+(op?' open':'')+'><summary><h2>'+esc(t[1])+' <small>'+list.length+' event'+(list.length===1?'':'s')+'</small><span class="chev" aria-hidden="true"></span></h2></summary>'+
        (list.length?group(list):'<div class="empty">Nothing confirmed here in this snapshot. Check organizer pages for updates.</div>')+'</details></section>';
    });
    document.getElementById('cities').innerHTML=html;
    var nsec=document.querySelectorAll('#cities > section').length;
    document.getElementById('count').textContent='Showing '+shown.length+' of '+upcoming.length+' events'+(f.group?' in '+nsec+' city section'+(nsec===1?'':'s'):' in one list')+(f.tier||f.type||f.must||f.free||f.cert?' (filters on)':'');
    var w=(DATA.watchlist||[]).filter(function(x){return !x.id||!isHidden(x.id)});
    var m0=pd(TODAY).getMonth()+1;
    function wk(x){return x.m?((x.m-m0+12)%12)+1:0}
    w.sort(function(a,b){return wk(a)-wk(b)||a.name.localeCompare(b.name)});
    document.getElementById('watch').innerHTML=w.length?'<section><div class="rule"></div><details class="sec" data-k="watch"'+(OPEN.watch?' open':'')+'><summary><h2>Watching <small>'+w.length+' events with no 2027 date yet</small><span class="chev" aria-hidden="true"></span></h2></summary>'+
      '<p class="note2" style="margin:2px 0 10px">These repeat every year but have not announced their next dates. The month is when the last edition ran, so it is a guide, not a date. They move into the list above as soon as dates and tickets are published.</p><div class="watch">'+
      w.map(function(x){return '<div><b><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.name)+'</a></b>'+(x.when?'<span class="tag">'+esc(x.when)+'</span> ':'')+'<span class="meta">'+esc(x.city)+' · '+esc(x.note)+'</span>'+(x.id?'<div class="acts" style="justify-content:flex-start;margin-top:6px"><button type="button" class="act ghost" data-a="wish" data-id="'+esc(x.id)+'"></button><button type="button" class="act ghost xb" data-a="hide" data-k="'+esc(x.id)+'" title="Remove from my page" aria-label="Remove '+esc(x.name)+' from my page">×</button></div>':'')+'</div>'}).join('')+'</div></details></section>':'';
    var hid=[]; (PLAN.hidden||[]).forEach(function(id){var e=evById(id)||(DATA.watchlist||[]).filter(function(x){return x.id===id})[0]; if(e) hid.push(e)});
    document.getElementById('past').innerHTML=(past.length?'<details><summary>Past events ('+past.length+')</summary>'+group(past)+'</details>':'')+
      (hid.length?'<details class="sec" data-k="hidden"'+(OPEN.hidden?' open':'')+'><summary>Removed by me ('+hid.length+')</summary><div class="watch">'+hid.map(function(e){return '<div><b>'+esc(e.name)+'</b> <span class="meta">'+esc(e.city||'')+'</span><div class="acts" style="justify-content:flex-start;margin-top:6px"><button type="button" class="act" data-a="restore" data-k="'+esc(e.id)+'">Put back</button></div></div>'}).join('')+'</div></details>':'');
    document.getElementById('foot').innerHTML=
      (META.baseline?'<p>First scan: everything above was added today, so nothing is marked New yet. After the next data update, new and changed events can appear at the top.</p>':'')+
      '<p>“Verified” means the date and venue were read from the organizer’s own page or ticket page. “Check” lists what is still unconfirmed. The big number is the cheapest ticket a working professional can buy now, before GST and booking fees unless noted; it is what the price sort uses. Events with no published price sort last.</p>'+
      (META.profile?'<p>Taste profile: '+esc(META.profile)+'</p>':'');
    refreshButtons();
  }
  /* ---------- Learning budget: cart, wishlist, custom items ---------- */
  var GST=0.18, DEFAULT_BUDGET=10000, LS_KEY='india-tech-events-plan-v1';
  var PLAN={v:1,budget:DEFAULT_BUDGET,spent:{},cart:[],wish:[],custom:[],hidden:[],marks:{}};
  var sheetYear=null, saveTimer=null, dbDoc=null, flashId=null, toastTimer=null, saveNote='';
  function $(id){return document.getElementById(id)}
  function inr(n){return '₹'+Math.round(n).toLocaleString('en-IN')}
  function kfmt(n){
    var a=Math.abs(n), s=n<0?'-':'';
    if(a>=100000) return s+'₹'+(a/100000).toFixed(2).replace(/\.?0+$/,'')+'L';
    if(a>=1000) return s+'₹'+(a/1000).toFixed(1).replace(/\.0$/,'')+'k';
    return s+'₹'+Math.round(a);
  }
  function watchAsEvent(w){
    var exp=w.m?('2027-'+(w.m<10?'0':'')+w.m+'-15'):null;
    return {id:w.id,name:w.name,city:w.city,start:null,exp:exp,date_label:w.when||'Date TBA',tiers:[],price_now_inr:null,price:'Not announced',url:w.url,watch:true};
  }
  function evById(id){
    for(var i=0;i<EV.length;i++){if(EV[i].id===id)return EV[i]}
    var ws=DATA.watchlist||[];
    for(var j=0;j<ws.length;j++){if(ws[j].id===id)return watchAsEvent(ws[j])}
    return null;
  }
  function evYear(e){return e.start?yearOf(e.start):(e.exp?yearOf(e.exp):curYear())}
  function curYear(){var d=pd(TODAY);return d.getMonth()>=1?d.getFullYear():d.getFullYear()-1}
  function yearOf(s){if(!s)return curYear();var d=pd(s);return d.getMonth()>=1?d.getFullYear():d.getFullYear()-1}
  function yearLabel(y){return 'Feb '+y+' – Jan '+(y+1)}
  function tiersOf(e){
    if(e.tiers&&e.tiers.length) return e.tiers;
    if(e.price_now_inr!=null) return [{name:'Cheapest available',price:e.price_now_inr}];
    return [];
  }
  function tierPrice(e,it){
    if(it.price!=null&&it.price!=='') return +it.price;
    var ts=tiersOf(e), t=ts.filter(function(x){return x.name===it.tier})[0]||ts[0];
    return t?t.price:null;
  }
  function lineTotal(it){
    var e=evById(it.id), p=e?tierPrice(e,it):(it.snap?it.snap.price:null);
    if(p==null) p=0;
    return Math.round(p*(it.qty||1)*(it.gst?1+GST:1)+(+it.fees||0)+(+it.travel||0));
  }
  function itemYear(it){var e=evById(it.id);return yearOf(e?e.start:(it.snap&&it.snap.start))}
  function customYear(c){return c.year!=null?+c.year:curYear()}
  function wishPrice(id){
    var e=evById(id); if(!e) return null;
    var ts=tiersOf(e); if(!ts.length) return null;
    var p=Math.min.apply(null,ts.map(function(t){return t.price}));
    return Math.round(p*(e.gst_extra?1+GST:1));
  }
  function summary(y){
    var cart=PLAN.cart.filter(function(i){return itemYear(i)===y});
    var cust=PLAN.custom.filter(function(c){return customYear(c)===y});
    var total=cart.reduce(function(s,i){return s+lineTotal(i)},0)+cust.reduce(function(s,c){return s+(+c.amount||0)},0);
    var spent=+(PLAN.spent[y]||0);
    var wish=PLAN.wish.filter(function(id){var e=evById(id);return e&&evYear(e)===y});
    var wtotal=wish.reduce(function(s,id){return s+(wishPrice(id)||0)},0);
    var nop=cart.filter(function(i){var e=evById(i.id);return !e||tierPrice(e,i)==null}).length+wish.filter(function(id){return wishPrice(id)==null}).length;
    return {cart:cart,cust:cust,total:total,spent:spent,used:spent+total,left:PLAN.budget-spent-total,wish:wish,wtotal:wtotal,nop:nop};
  }
  function leftClass(s){return s.left<0?'over':(s.left<PLAN.budget*0.15?'low':'ok')}

  /* persistence: account database when available, browser storage as backup */
  function snapData(s){
    if(s==null) return null;
    var ex=s.exists; if(typeof ex==='function') ex=ex.call(s);
    if(ex===false) return null;
    var d=typeof s.data==='function'?s.data():(s.data!==undefined?s.data:s);
    return d&&typeof d==='object'?d:null;
  }
  function applyPlan(d){
    if(!d) return;
    PLAN.budget=+d.budget||DEFAULT_BUDGET; PLAN.spent=d.spent||{};
    PLAN.cart=d.cart||[]; PLAN.wish=d.wish||[]; PLAN.custom=d.custom||[]; PLAN.hidden=d.hidden||[]; PLAN.marks=d.marks||{};
  }
  function afterLoad(){render();refreshButtons();renderDock();if(!$('sheet').hidden)renderSheet()}
  function loadPlan(){
    try{var raw=localStorage.getItem(LS_KEY); if(raw) applyPlan(JSON.parse(raw))}catch(e){}
    afterLoad();
    try{
      if(window.claude&&window.claude.use){
        window.claude.use('db').then(function(db){
          if(!db) return;
          dbDoc=db.doc('plan/main');
          return Promise.resolve(dbDoc.get()).then(function(s){
            var d=snapData(s); if(d) applyPlan(d);
            saveNote='Synced to your account'; afterLoad();
          });
        }).catch(function(){dbDoc=dbDoc||null});
      }
    }catch(e){}
  }
  function setNote(t){saveNote=t; var n=$('savenote'); if(n) n.textContent=t}
  function save(){
    clearTimeout(saveTimer); setNote('Saving…');
    saveTimer=setTimeout(function(){
      var data=JSON.parse(JSON.stringify(PLAN));
      try{localStorage.setItem(LS_KEY,JSON.stringify(data))}catch(e){}
      if(dbDoc){
        try{
          Promise.resolve(dbDoc.set(data)).then(function(){setNote('Saved to your account')},function(){setNote('Saved on this device only')});
        }catch(e){setNote('Saved on this device only')}
      } else setNote('Saved on this device only');
    },300);
  }
  function toast(t){var el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.hidden=true},2200)}

  function inCart(id){return PLAN.cart.some(function(i){return i.id===id})}
  function inWish(id){return PLAN.wish.indexOf(id)>=0}
  function refreshButtons(){
    var bs=document.querySelectorAll('button[data-a][data-id]');
    for(var k=0;k<bs.length;k++){
      var b=bs[k], id=b.getAttribute('data-id'), a=b.getAttribute('data-a');
      if(a==='cart'){var on=inCart(id); b.textContent=on?'In cart ✓':'Add to cart'; b.className='act'+(on?' on':' primary')}
      else{var w=inWish(id); b.textContent=w?'Wishlisted':'Wishlist'; b.className='act ghost'+(w?' on':'')}
    }
  }
  function addCart(id){
    var e=evById(id); if(!e) return;
    if(inCart(id)){openSheet(evYear(e),id);return}
    PLAN.wish=PLAN.wish.filter(function(x){return x!==id});
    var ts=tiersOf(e), t=ts[0];
    PLAN.cart.push({id:id,tier:t?t.name:null,qty:1,gst:e.gst_extra===true,fees:0,travel:0,price:null,
      snap:{name:e.name,start:e.start||null,price:t?t.price:null}});
    save(); refreshButtons(); renderDock();
    if(ts.length>1||!t) openSheet(yearOf(e.start),id); else toast('Added to cart');
  }
  function toggleWish(id){
    if(inWish(id)) PLAN.wish=PLAN.wish.filter(function(x){return x!==id});
    else{ if(inCart(id)){toast('Already in your cart');return} PLAN.wish.push(id); toast('Added to wishlist') }
    save(); refreshButtons(); renderDock(); if(!$('sheet').hidden) renderSheet();
  }

  function renderDock(){
    var y=curYear(), s=summary(y), pct=PLAN.budget>0?Math.min(100,Math.round(s.used/PLAN.budget*100)):0, cls=leftClass(s);
    var nxt=summary(y+1), extra=(nxt.cart.length+nxt.cust.length)?(' · +'+(nxt.cart.length+nxt.cust.length)+' in next budget year'):'';
    $('dock').innerHTML='<div class="dockin"><div class="dockmain"><div class="dockline">'+
      '<span class="dockamt">'+kfmt(s.used)+' / '+kfmt(PLAN.budget)+'</span>'+
      '<span class="dockleft '+cls+'">'+(s.left<0?kfmt(-s.left)+' over budget':kfmt(s.left)+' left')+'</span></div>'+
      '<div class="bar2" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i class="'+(cls==='ok'?'':cls)+'" style="width:'+pct+'%"></i></div>'+
      '<div class="docksub">Cart '+(s.cart.length+s.cust.length)+' · Wishlist '+s.wish.length+(s.wish.length?' ('+kfmt(s.wtotal)+')':'')+' · '+esc(yearLabel(y))+esc(extra)+'</div></div>'+
      '<button type="button" class="act primary" data-a="open">Open cart</button></div>';
  }

  function openSheet(y,fid){sheetYear=y!=null?y:curYear();flashId=fid||null;$('sheet').hidden=false;renderSheet();document.body.style.overflow='hidden';
    var f=document.querySelector('.citem.flash'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'center'})}
  function closeSheet(){$('sheet').hidden=true;document.body.style.overflow='';flashId=null}
  function yearsList(){
    var ys={}; ys[curYear()]=1; ys[curYear()+1]=1;
    PLAN.cart.forEach(function(i){ys[itemYear(i)]=1}); PLAN.custom.forEach(function(c){ys[customYear(c)]=1});
    PLAN.wish.forEach(function(id){var e=evById(id);if(e)ys[evYear(e)]=1});
    return Object.keys(ys).map(Number).sort();
  }
  function numIn(label,f,key,val,extra){return '<label class="fld">'+label+'<input type="number" min="0" step="any" inputmode="decimal" data-f="'+f+'" data-k="'+esc(key)+'" value="'+(val===0||val?esc(val):'')+'" '+(extra||'')+'></label>'}
  function cartRow(it){
    var e=evById(it.id), ts=e?tiersOf(e):[], p=e?tierPrice(e,it):null, noPrice=(p==null);
    var name=e?e.name:(it.snap&&it.snap.name)||it.id;
    var meta=e?(e.start?dateTxt(e):(e.date_label||'Date TBA'))+' · '+e.city:'';
    var tierSel=ts.length>1?'<label class="fld">Ticket<select data-f="tier" data-k="'+esc(it.id)+'">'+ts.map(function(t){return '<option value="'+esc(t.name)+'"'+(t.name===it.tier?' selected':'')+'>'+esc(t.name)+' – '+inr(t.price)+'</option>'}).join('')+'</select></label>':'';
    return '<div class="citem'+(flashId===it.id?' flash':'')+'"><div class="chead"><b>'+esc(name)+'</b><span class="meta">'+esc(meta)+(ts.length===1?' · '+esc(ts[0].name)+' '+inr(ts[0].price):'')+'</span></div>'+
      (flashId===it.id&&ts.length>1?'<p class="note2">Pick your ticket below. The price updates the total.</p>':'')+
      (noPrice?'<p class="note2">No price published yet. Type one to include it in your total.</p>':'')+
      '<div class="frow">'+tierSel+(noPrice?numIn('Price (₹)','price',it.id,it.price):'')+numIn('Tickets','qty',it.id,it.qty||1,'min="1" step="1"')+
      numIn('Booking fees (₹)','fees',it.id,it.fees||0)+numIn('Travel and stay (₹)','travel',it.id,it.travel||0)+'</div>'+
      '<label class="chk"><input type="checkbox" data-f="gst" data-k="'+esc(it.id)+'"'+(it.gst?' checked':'')+'> Add 18% GST'+(e&&e.gst_extra?' (organizer quotes prices without GST)':' (tick if the price excludes GST)')+'</label>'+
      '<div class="cfoot"><span class="ctotal">'+inr(lineTotal(it))+'</span><span><button type="button" class="act ghost" data-a="tow" data-k="'+esc(it.id)+'">Move to wishlist</button> <button type="button" class="act danger" data-a="rmc" data-k="'+esc(it.id)+'">Remove</button></span></div></div>';
  }
  function dateTxt(e){var s=pd(e.start),t=e.end&&e.end!==e.start?pd(e.end):null;return s.getDate()+' '+MON[s.getMonth()]+(t?'–'+t.getDate()+' '+MON[t.getMonth()]:'')+' '+s.getFullYear()}
  function renderSheet(){
    var y=sheetYear, s=summary(y), cls=leftClass(s), pct=PLAN.budget>0?Math.min(100,Math.round(s.used/PLAN.budget*100)):0;
    var tabs=yearsList().map(function(k){return '<button type="button" class="chip" aria-pressed="'+(k===y)+'" data-a="year" data-k="'+k+'">'+esc(yearLabel(k))+(k===curYear()?' (now)':'')+'</button>'}).join('');
    var h='<div class="panel"><div class="phead"><h2>My learning budget</h2><button type="button" class="act" data-a="close">Close</button></div>'+
      '<div class="tabs">'+tabs+'</div>'+
      '<div class="bcard"><div class="bigamt">'+inr(s.used)+' <span style="color:var(--muted);font-size:18px">/ '+inr(PLAN.budget)+'</span></div>'+
      '<div class="bar2"><i class="'+(cls==='ok'?'':cls)+'" style="width:'+pct+'%"></i></div>'+
      '<div class="dockleft '+cls+'">'+(s.left<0?inr(-s.left)+' over budget':inr(s.left)+' remaining')+'</div>'+
      '<div class="docksub">Already spent '+inr(s.spent)+' · Cart '+inr(s.total)+(s.nop?' · '+s.nop+' item'+(s.nop>1?'s':'')+' without a price':'')+'</div>'+
      '<div class="frow">'+numIn('Yearly budget (₹)','budget','b',PLAN.budget)+numIn('Already spent this budget year (₹)','spent',String(y),s.spent)+'</div></div>';
    h+='<div class="sec">Cart · '+(s.cart.length+s.cust.length)+' item'+((s.cart.length+s.cust.length)===1?'':'s')+'</div>';
    if(!s.cart.length&&!s.cust.length) h+='<p class="note2">Nothing in your cart for '+esc(yearLabel(y))+'. Add events with “Add to cart”, or add a course below.</p>';
    s.cart.forEach(function(it){h+=cartRow(it)});
    s.cust.forEach(function(c){h+='<div class="citem"><div class="chead"><b>'+esc(c.name)+'</b><span class="meta">'+esc(c.kind||'Other')+(c.date?' · '+esc(c.date):'')+'</span></div><div class="cfoot"><span class="ctotal">'+inr(+c.amount||0)+'</span><button type="button" class="act danger" data-a="rmx" data-k="'+esc(c.cid)+'">Remove</button></div></div>'});
    h+='<div class="bcard"><div class="sec" style="margin:0">Add a course, certification or other cost</div><div class="frow">'+
      '<label class="fld">Name<input type="text" id="cx-name" placeholder="e.g. AWS Solutions Architect exam"></label>'+
      '<label class="fld">Type<select id="cx-kind"><option>Course</option><option>Certification</option><option>Exam</option><option>Other</option></select></label>'+
      '<label class="fld">Amount (₹)<input type="number" min="0" step="any" id="cx-amt" inputmode="decimal"></label>'+
      '<label class="fld">Date (optional)<input type="date" id="cx-date"></label></div>'+
      '<div><button type="button" class="act primary" data-a="addx">Add to cart</button></div></div>';
    h+='<div class="sec">Wishlist · '+s.wish.length+(s.wish.length?' · '+inr(s.wtotal):'')+'</div>';
    if(!s.wish.length) h+='<p class="note2">Nothing wishlisted for this budget year. Wishlist items do not count toward your budget until you move them to the cart.</p>';
    s.wish.forEach(function(id){var e=evById(id),p=wishPrice(id);
      h+='<div class="citem"><div class="chead"><b>'+esc(e.name)+'</b><span class="meta">'+(e.start?dateTxt(e):esc(e.date_label||'Date TBA'))+' · '+esc(e.city)+'</span></div>'+
        '<div class="cfoot"><span class="ctotal">'+(p==null?'Price not published':'from '+inr(p))+'</span><span>'+(e.watch?'<span class="meta">Not open yet. Moves to the main list once dates are announced.</span> ':'<button type="button" class="act primary" data-a="tocart" data-k="'+esc(id)+'">Move to cart</button> ')+'<button type="button" class="act danger" data-a="rmw" data-k="'+esc(id)+'">Remove</button></span></div></div>'});
    if(s.wish.length) h+='<p class="note2">If you bought the whole wishlist too, you would have '+(s.left-s.wtotal<0?inr(s.wtotal-s.left)+' over budget':inr(s.left-s.wtotal)+' left')+'. Wishlist prices use the cheapest ticket'+'.</p>';
    h+='<p class="note2" id="savenote">'+esc(saveNote)+'</p></div>';
    var sh=$('sheet'), top=sh.firstChild?sh.firstChild.scrollTop:0;
    sh.innerHTML=h; if(sh.firstChild) sh.firstChild.scrollTop=top;
  }

  document.addEventListener('click',function(ev){
    var t=ev.target.closest?ev.target.closest('[data-a]'):null;
    if(!t){ if(ev.target.id==='sheet') closeSheet(); return }
    var a=t.getAttribute('data-a'), id=t.getAttribute('data-id'), k=t.getAttribute('data-k');
    if(a==='cart') addCart(id);
    else if(a==='wish') toggleWish(id);
    else if(a==='hide'){if(PLAN.hidden.indexOf(k)<0)PLAN.hidden.push(k);save();render();toast('Removed. You can put it back from "Removed by me" at the bottom.')}
    else if(a==='restore'){PLAN.hidden=PLAN.hidden.filter(function(x){return x!==k});save();render();toast('Put back')}
    else if(a==='mark'){var ev0=evById(k),S0=ev0?st(ev0):'none';PLAN.marks[k]=(S0==='want'||S0==='attending')?'none':'want';save();render();toast(PLAN.marks[k]==='want'?'Added to My Plans':'Removed from My Plans')}
    else if(a==='open') openSheet(curYear());
    else if(a==='close') closeSheet();
    else if(a==='year'){sheetYear=+k;renderSheet()}
    else if(a==='rmc'){PLAN.cart=PLAN.cart.filter(function(i){return i.id!==k});changed()}
    else if(a==='tow'){PLAN.cart=PLAN.cart.filter(function(i){return i.id!==k});if(!inWish(k))PLAN.wish.push(k);changed()}
    else if(a==='tocart'){PLAN.wish=PLAN.wish.filter(function(x){return x!==k});addCartFromSheet(k)}
    else if(a==='rmw'){PLAN.wish=PLAN.wish.filter(function(x){return x!==k});changed()}
    else if(a==='rmx'){PLAN.custom=PLAN.custom.filter(function(c){return c.cid!==k});changed()}
    else if(a==='addx'){
      var nm=$('cx-name').value.trim(), amt=parseFloat($('cx-amt').value), dt=$('cx-date').value;
      if(!nm||isNaN(amt)||amt<0){toast('Add a name and an amount');return}
      PLAN.custom.push({cid:'c'+Date.now(),name:nm,amount:amt,kind:$('cx-kind').value,date:dt||'',year:dt?yearOf(dt):sheetYear});
      changed();
    }
  });
  function addCartFromSheet(id){
    var e=evById(id); if(!e){changed();return}
    var ts=tiersOf(e), t=ts[0];
    PLAN.cart.push({id:id,tier:t?t.name:null,qty:1,gst:e.gst_extra===true,fees:0,travel:0,price:null,snap:{name:e.name,start:e.start||null,price:t?t.price:null}});
    flashId=id; changed();
  }
  function changed(){save();refreshButtons();renderDock();renderSheet()}
  document.addEventListener('change',function(ev){
    var t=ev.target; if(!t.getAttribute) return;
    var f=t.getAttribute('data-f'); if(!f) return;
    var k=t.getAttribute('data-k'), v=t.type==='checkbox'?t.checked:t.value;
    if(f==='budget'){PLAN.budget=Math.max(0,parseFloat(v)||0)}
    else if(f==='spent'){PLAN.spent[k]=Math.max(0,parseFloat(v)||0)}
    else{
      var it=PLAN.cart.filter(function(i){return i.id===k})[0]; if(!it) return;
      if(f==='tier') it.tier=v;
      else if(f==='gst') it.gst=!!v;
      else if(f==='qty') it.qty=Math.max(1,parseInt(v,10)||1);
      else if(f==='price') it.price=v===''?null:Math.max(0,parseFloat(v)||0);
      else it[f]=Math.max(0,parseFloat(v)||0);
    }
    changed();
  });
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('sheet').hidden) closeSheet()});

  render();
  refreshButtons();
  loadPlan();
})();
</script>

</body></html>
